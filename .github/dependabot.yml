version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "CI"
    groups:
      doctrine:
        patterns:
          - "doctrine/*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    allow:
      - dependency-name: "phpstan/*"
    groups:
      phpstan:
        patterns:
          - "phpstan/*"
