name: "Atlas CI"

on:
  pull_request:
    branches:
      - "*.x"
      - "feature/*"
  push:

jobs:
  atlas-local:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
        symfony-version:
          - ""
        proxy:
          - "native"
        include:
          # Test with LazyGhostObject
          - php-version: "8.2"
            symfony-version: ""
            proxy: "lazy-ghost"
            os: "ubuntu-latest"
          # Test with ProxyManager
          - php-version: "8.1"
            symfony-version: "^6.4"
            proxy: "proxy-manager"
            os: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 2

      - name: "Create MongoDB Atlas Local"
        timeout-minutes: 5
        run: |
          docker run --name mongodb -p 27017:27017 \
            -e VOYAGE_API_KEY=${{ secrets.VOYAGE_API_KEY }} \
            -e EMBEDDING_PROVIDER_ENDPOINT=https://api.voyageai.com/v1/embeddings \
            --detach mongodb/mongodb-atlas-local:preview
          until docker exec --tty mongodb mongosh --eval "db.runCommand({ ping: 1 })"; do
            sleep 1
          done
          until docker exec --tty mongodb mongosh --eval "db.createCollection('connection_test') && db.getCollection('connection_test').createSearchIndex({mappings:{dynamic: true}})"; do
            sleep 1
          done
          until docker exec --tty mongodb mongosh --eval "db.runCommand({ serverStatus: 1 })"; do
            sleep 1
          done

      - name: Setup cache environment
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ matrix.php-version }}
          extensions: "mongodb, bcmath"
          key: "extcache-v1"

      - name: Cache extensions
        uses: actions/cache@v6
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          tools: "flex"
          extensions: "mongodb, bcmath"
          coverage: "none"
          ini-values: "zend.assertions=1"

      - name: "Show driver information"
        run: "php --ri mongodb"

      # Not used, skip transient dependencies
      - name: "Remove phpbench/phpbench"
        run: composer remove --no-update --dev phpbench/phpbench

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist"
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

      - name: "Run PHPUnit with Atlas Local"
        run: "vendor/bin/phpunit --group atlas"
        env:
          DOCTRINE_MONGODB_SERVER: "mongodb://127.0.0.1:27017/?directConnection=true"
          USE_LAZY_GHOST_OBJECT: ${{ matrix.proxy == 'lazy-ghost' && '1' || '0' }}
          USE_NATIVE_LAZY_OBJECT: ${{ matrix.proxy == 'native' && '1' || '0' }}
